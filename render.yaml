# CineBook Ultra — Render deployment config (Blueprint)
# https://render.com/docs/blueprint-spec
#
# Bitta service frontend VA API VA Swagger UI'ni bir domen ostida beradi:
#   /            → frontend (SPA)
#   /api-docs    → Swagger UI
#   /openapi.json→ OpenAPI 3.0 spetsifikatsiyasi
#   /api/*       → mock backend
# Shu sababli CORS muammosi ham bo'lmaydi.

services:
  - type: web
    name: cinebook-ultra
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node mock-server.cjs
    healthCheckPath: /api/health
    envVars:
      # Bo'sh qoldirilsa — frontend o'zi o'z domeniga (same-origin) ulanadi.
      # Faqat frontend va API alohida deploy qilinganda kerak:
      # - key: VITE_API_URL
      #   value: https://your-backend.onrender.com
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
